name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress package
        working-directory: EchoMindJava
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: EchoMind/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: EchoMind
      - run: python -m pytest tests
        working-directory: EchoMind
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EchoMindFrontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: EchoMindFrontend
