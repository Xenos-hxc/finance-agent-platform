services:
  agent-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: agent-api
    ports:
    - 8000:8000
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      LLM_STARTUP_API_KEY: ${LLM_STARTUP_API_KEY:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-local-demo}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-local-demo}@redis:6379/0
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      EVAL_BASELINE_PATH: /app/data/eval/baseline.json
      FINANCE_AGENT_SKILLS_DIR: /app/skills
    volumes:
    - agent-api-data:/app/data
    - ../backend/skills:/app/skills
    depends_on:
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    restart: unless-stopped
    networks:
    - finance-agent-network
  redis:
    image: redis:7-alpine
    container_name: finance-agent-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me-local-demo}
    volumes:
    - redis-data:/data
    restart: unless-stopped
    networks:
    - finance-agent-network
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: finance-agent-chromadb
    ports:
    - 8001:8000
    environment:
      IS_PERSISTENT: 'TRUE'
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: 'FALSE'
    volumes:
    - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
    - finance-agent-network
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-agent-frontend
    environment:
      API_URL: /api
    ports:
    - ${FRONTEND_PORT:-5174}:80
    depends_on:
      agent-api:
        condition: service_started
    restart: unless-stopped
    networks:
    - finance-agent-network
  nginx:
    image: nginx:1.27-alpine
    container_name: finance-agent-gateway
    ports:
    - 80:80
    volumes:
    - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      agent-api:
        condition: service_started
    restart: unless-stopped
    networks:
    - finance-agent-network
networks:
  finance-agent-network:
    driver: bridge
volumes:
  redis-data: null
  chromadb-data: null
  agent-api-data: null
