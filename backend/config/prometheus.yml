# Prometheus 配置文件 — 金融理财客服平台多Agent协作系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'finance_agent'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # 金融理财客服平台多Agent协作系统 主应用指标
  - job_name: 'finance-agent-app'
    static_configs:
      - targets: ['agent-api:8000']
        labels:
          service: 'finance_agent'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
